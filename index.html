function productFilter(all){return db.products.filter(p=>(all||p.active)&&(!category||p.category===category)&&(!search||(p.name+' '+p.sku+' '+p.volume).toLowerCase().includes(search.toLowerCase())))}
function filters(){return '<div class="filters"><input id="search" value="'+esc(search)+'" placeholder="Buscar produto ou código de barras…" aria-label="Buscar produto" autocomplete="off"><select id="category" aria-label="Filtrar categoria"><option value="">Todas as categorias</option>'+options(CATS,category)+'</select></div>'}
function cartTotals(){let items=Object.entries(cart).filter(([id,q])=>q>0).map(([id,qty])=>{const p=db.products.find(p=>p.id===Number(id));return {...p,qty}});let sub=sum(items,i=>i.price*i.qty),discount=cents(saleDraft.discount)||0,total=sub-discount,fee=Math.round(total*(Number(saleDraft.fee)||0)/100),cost=sum(items,i=>i.cost*i.qty);return {items,sub,discount,total,fee,cost}}

function stockModal(id){access.require();if(!db.products.length)return toast('Cadastre um produto primeiro.',true);modal('Movimentar estoque','<form id="stockForm"><div class="fields"><label class="wide">Produto<select name="productId">'+db.products.map(p=>'<option value="'+p.id+'" '+(p.id===id?'selected':'')+'>'+esc(p.name)+' · '+p.stock+' disponíveis</option>').join('')+'</select></label><label>Operação<select name="type">'+options(['Reposição / compra','Perda / avaria','Ajuste de inventário'],'Reposição / compra')+'</select></label><label id="qtyStockLabel">Quantidade recebida<input name="qty" type="number" min="1" step="1" required></label><label id="costStockLabel">Custo unitário da compra (R$)<input name="cost" type="number" min="0" step="0.01" required></label><label class="wide">Motivo / fornecedor<input name="reason" required maxlength="180" placeholder="Informe o motivo ou a referência da compra"></label><div id="stockPurchase" class="wide"><label class="check"><input name="paid" type="checkbox"> Registrar pagamento desta compra no caixa aberto</label><label style="margin-top:12px">Pagamento<select name="method">'+options(METHODS,'Pix')+'</select></label></div></div><div class="note">Reposições recalculam o custo médio ponderado. Perdas e ajustes alteram o saldo com justificativa. No ajuste, informe a quantidade total contada.</div><div class="formactions"><button type="button" class="btn secondary" data-action="close">Voltar</button><button class="btn primary">Confirmar movimento</button></div></form>')}

function zeroCash(){access.require();if(!localStore.user)return toast('Aguarde o carregamento dos dados locais.',true);const c=current();if(!c)return toast('Abra o caixa primeiro.',true);const balance=expected(c);if(balance===0)return toast('O saldo em dinheiro já está zerado.');if(balance<0)return toast('O saldo está negativo. Confira as movimentações antes de zerar.',true);modal('Zerar caixa','<form id="zeroForm" data-session="'+c.id+'" data-amount="'+balance+'"><div class="total"><small>Dinheiro a retirar da gaveta</small><div class="big">'+money(balance)+'</div></div><p class="muted">Retire esse valor da gaveta. O sistema registrará uma sangria e o saldo em dinheiro ficará em R$ 0,00. O caixa continuará aberto.</p><div class="note">Vendas, estoque, Pix, cartões e histórico serão preservados. Esta retirada não é uma despesa e não altera o lucro.</div><label>Motivo da retirada<input name="reason" required minlength="3" maxlength="180" value="Retirada total do dinheiro em caixa"></label><div class="fields" style="margin-top:16px"><label class="wide">Confirme sua senha<input name="password" type="password" required autocomplete="current-password"></label></div><div class="formactions"><button type="button" class="btn secondary" data-action="close">Voltar</button><button class="btn primary">Confirmar e zerar caixa</button></div></form>')}
function cashMove(){access.require();if(!current())return toast('Abra o caixa primeiro.',true);modal('Entrada ou saída de caixa','<form id="moveForm"><div class="fields"><label class="wide">Tipo de movimento<select name="type">'+options(['Despesa operacional','Suprimento / aporte','Outra entrada','Sangria / retirada'],'Despesa operacional')+'</select></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Pagamento<select name="method">'+options(METHODS,'Espécie')+'</select></label><label class="wide">Descrição / justificativa<input name="description" required maxlength="180"></label></div><div class="note">Suprimentos e sangrias alteram o caixa, mas não o lucro operacional. Registros são feitos na data atual.</div><div class="formactions"><button class="btn primary">Registrar movimento</button></div></form>')}

if(f.id==='saleForm'){discountAccess.require();const discountApproval=discountAccess.approval;const c=current(),t=cartTotals(),rate=Number(saleDraft.fee)||0,received=saleDraft.method==='Espécie'?cents(saleDraft.received):t.total;if(!c)throw Error('Abra o caixa primeiro.');if(!t.items.length||!int(t.discount)||t.discount>=t.sub||!Number.isFinite(rate)||rate<0||rate>100)throw Error('Confira o carrinho, desconto e taxa.');if(!int(received)||received<t.total)throw Error('O valor recebido deve cobrir o total da venda.');if(t.items.some(i=>!int(i.qty,1)||i.qty>i.stock||!i.active))throw Error('Estoque insuficiente ou produto indisponível.');const auto=saleDraft.auto,w=auto?window.open('','_blank','width=450,height=700'):null;let sale;if(await commit(d=>{sale={id:d.mid++,kind:'sale',date:today(),createdAt:now(),description:t.items.map(i=>i.qty+' × '+i.name+' ('+i.pack+')').join(', '),method:saleDraft.method,amount:t.total,cost:t.cost,discount:t.discount,...(t.discount?{discountAuthorization:{uid:discountApproval.uid,email:discountApproval.email,at:discountApproval.at,amount:t.discount}}:{}),fee:t.fee,feeRate:rate,received,change:received-t.total,customer:saleDraft.customer,items:t.items.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost,pack:i.pack})),sessionId:c.id,receipt:{...d.settings}};d.moves.push(sale);t.items.forEach(i=>{const p=d.products.find(p=>p.id===i.id),before=p.stock;p.stock-=i.qty;stockLog(d,p,before,'Venda','Venda #'+sale.id)})},{kind:'sale'})){discountAccess.reset();cart={};saleDraft={method:saleDraft.method,discount:'',fee:'',received:'',customer:'',auto};render();toast('Venda #'+sale.id+' concluída. Estoque atualizado.');if(w)receipt(sale,w);else if(auto)toast('Venda salva. Permita pop-ups e imprima pelo histórico.',true)}else if(w)w.close()}

async function importFile(file){try{access.require();if(file.size>25*1024*1024)throw Error('O backup deve ter até 25 MB.');const raw=JSON.parse(await file.text()),x=normalize(validate(raw.db||raw.data||raw));modal('Restaurar cópia de segurança','<div class="note warn">Esta restauração substituirá os dados atuais por '+x.products.length+' produtos, '+x.moves.length+' movimentos e '+x.sessions.length+' sessões de caixa.</div><p class="muted">Exporte o backup atual antes de continuar. A restauração não combina bases.</p><div class="formactions">'+button('Exportar backup atual','backup','secondary')+'<button id="restoreConfirm" type="button" class="btn danger">Substituir pelos dados do backup</button></div>');$('#restoreConfirm').onclick=async()=>{access.require();if(await commit(d=>{Object.keys(d).forEach(k=>delete d[k]);Object.assign(d,x)},{restore:true})){cart={};close();render();toast('Backup restaurado. Confira o estoque antes de vender.')}}}catch(err){toast('Não foi possível importar: '+err.message,true)}finally{if($('#importFile'))$('#importFile').value=''}}

class LocalBridge{
 constructor(){this.user={uid:'demonstracao-local',email:'Administrador demonstrativo'};this.ready=true;this.connected=true;this.busy=false;this.initialized=true;this.pending=[]}
 paint(){
 const bar=$('#cloudbar');
 bar.className='cloudbar'+(storageError||stale?' warning':'');
 bar.innerHTML='<div><b>DEMONSTRAÇÃO · MARCIEL BEBIDAS</b><small>'+esc(storageError?'Armazenamento indisponível ou inválido. Exporte seus registros antes de continuar.':stale?'Os dados foram alterados em outra aba. Recarregue antes de continuar.':'Dados fictícios · Salvos apenas neste navegador · Funciona sem internet')+'</small></div><div class="actions">'+(stale?button('Recarregar dados','localRefresh','secondary small'):'')+button('Reiniciar demonstração','resetDemo','secondary small')+'</div>';
 }
 async reauthenticate(_identity,password){if(password!==ADMIN_PASSWORD)throw Error('Senha administrativa incorreta.')}
 async save(fn,options={}){
 if(options.kind==='sale')discountAccess.require();else access.require();
 if(storageError)throw Error('O navegador não permite salvar ou contém dados inválidos. Preserve um backup antes de continuar.');
 if(stale||localStorage.getItem(KEY)!==lastSaved){stale=true;this.paint();throw Error('Os registros mudaram em outra aba. Recarregue os dados antes de continuar.')}
 const candidate=JSON.parse(JSON.stringify(db));fn(candidate);validate(candidate);
 const serialized=JSON.stringify(candidate);
 try{localStorage.setItem(KEY,serialized)}catch{throw Error('Não foi possível salvar. Libere espaço ou permita o armazenamento do navegador. A operação não foi concluída.')}
 db=candidate;lastSaved=serialized;this.paint();return true;
 }
 start(){
 if(!lastSaved&&!storageError){try{const data=JSON.stringify(db);localStorage.setItem(KEY,data);lastSaved=data}catch{storageError=true}}
 $('#authGate').classList.add('hidden');$('.app').classList.remove('hidden');render();this.paint();
 }
 reset(){
 if(!confirm('Reiniciar a demonstração? Todas as vendas, cadastros e alterações deste demonstrativo serão substituídos pelos produtos fictícios iniciais.'))return;
 access.require();
 const candidate=demoDB(),data=JSON.stringify(candidate);
 localStorage.setItem(KEY,data);db=candidate;lastSaved=data;storageError=false;stale=false;
 discountAccess.reset();cart={};highlightedProductId=null;saleDraft={method:'Pix',discount:'',fee:'',received:'',customer:'',auto:false};month=today().slice(0,7);day=today();close();access.lock();toast('Demonstração reiniciada. Produtos fictícios restaurados.');
 }
}
window.addEventListener('storage',e=>{if(e.key===KEY||e.key===null){stale=true;localStore.paint()}});

window.addEventListener('pageshow',e=>{if(e.persisted)access.lock()});
const localStore=new LocalBridge();
render();
localStore.start();
})();
